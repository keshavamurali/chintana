# Run 1: ordinary residual GPT (the "forward Euler" update), fixed batch.
# Model (20.1M params) and the rest of the defaults live in ../common.py.
rev:
  variant: baseline
data:
  batch_size: 64          # 64 x 512 = 32,768 tokens / step -> 1,526 steps for 50M tokens
  total_tokens: 50000000
run:
  name: run1_baseline
