io:
  out_dir: out-shakespeare
  eval_interval: 5
  eval_iters: 40
  always_save_checkpoint: false # only save checkpoints if the validation loss improves
  init_from: gpt2-xl # this is the largest GPT-2 model

wandb:
  log: false # feel free to turn on
  project: shakespeare
  run_name: ft-shakespeare # was 'ft-' + str(time.time()) in the old python config

data:
  dataset: shakespeare
  # the number of examples per iter:
  # 1 batch_size * 32 grad_accum * 1024 tokens = 32,768 tokens/iter
  # shakespeare has 301,966 tokens, so 1 epoch ~= 9.2 iters
  batch_size: 1
  gradient_accumulation_steps: 32

optim:
  max_iters: 20
  learning_rate: 3e-5 # finetune at constant LR
  decay_lr: false
